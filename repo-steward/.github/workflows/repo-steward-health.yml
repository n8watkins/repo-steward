name: Repo Steward Health

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 16:00 UTC
    - cron: "0 16 * * 1"

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate health report
        run: npm run steward:health

      - name: Commit health report if changed
        run: |
          if [[ -n "$(git status --porcelain reports/repo-health.md)" ]]; then
            git config user.name "repo-steward[bot]"
            git config user.email "repo-steward[bot]@users.noreply.github.com"
            git add reports/repo-health.md
            git commit -m "chore: update repo stewardship report"
            git push
          else
            echo "No report changes to commit."
          fi
